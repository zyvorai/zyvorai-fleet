{{- if .Values.gateway.enabled }}
# Optional Gateway API front door served by Setura (https://github.com/zyvorai/zyvor-setura-gateway).
# Install the controller once per cluster:
#   setura gateway install --image ghcr.io/zyvorai/zyvor-setura-gateway:0.7.0 --namespace setura-system | kubectl apply -f -
# The Ingress template stays available; enable this instead of ingress.enabled, not as well.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "zyvor-fleet.name" . }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  listeners:
    - name: http
      protocol: HTTP
      port: {{ .Values.gateway.httpPort }}
      allowedRoutes:
        namespaces:
          from: Same
{{- if .Values.gateway.tls.enabled }}
    - name: https
      protocol: HTTPS
      port: {{ .Values.gateway.httpsPort }}
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ .Values.gateway.tls.secretName }}
      allowedRoutes:
        namespaces:
          from: Same
{{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "zyvor-fleet.name" . }}
spec:
  parentRefs:
    - name: {{ include "zyvor-fleet.name" . }}
  hostnames:
    - {{ .Values.ingress.host | quote }}
  rules:
    - backendRefs:
        - name: {{ include "zyvor-fleet.name" . }}
          port: {{ .Values.service.port }}
{{- end }}
