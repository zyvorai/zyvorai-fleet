<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fleet hero card</title>
<!--
  1200x630 dark hero card: README hero and GitHub social preview.
  Build: ./docs/social/build-hero-dark.sh  ->  fleet-hero-dark.jpg (2400x1260)
-->
<style>
  :root { --blue:#0071e3; --signal:#2997ff; --cyan:#64d2ff; --green:#30d158; --amber:#ff9f0a; --red:#ff453a; --violet:#bf5af2;
    --sans:'SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif; --mono:'SF Mono',Menlo,Consolas,monospace; }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; }
  body { width:1200px; height:630px; overflow:hidden; color:#f5f5f7; font-family:var(--sans); position:relative; background:#000; }
  .aurora { position:absolute; inset:0;
    background:radial-gradient(720px 460px at 80% 16%, rgba(41,151,255,.34), transparent 62%),
               radial-gradient(600px 420px at 104% 98%, rgba(100,210,255,.16), transparent 60%),
               radial-gradient(520px 380px at 6% 110%, rgba(0,113,227,.28), transparent 60%); }
  .copy { position:absolute; left:60px; top:52px; width:560px; z-index:3; }
  .brand { display:flex; align-items:center; gap:12px; font-family:var(--mono); font-size:14px; letter-spacing:.18em; text-transform:uppercase; color:#a1a1a6; }
  .brand b { color:#fff; }
  .word { margin:20px 0 0; font-size:112px; line-height:.95; font-weight:800; letter-spacing:-.05em; white-space:nowrap;
    background:linear-gradient(92deg,#fff 0%,#e3f0ff 38%,var(--signal) 74%,var(--cyan) 100%); -webkit-background-clip:text; background-clip:text; color:transparent; padding-bottom:6px; }
  .tag { margin:14px 0 0; font-size:31px; line-height:1.15; font-weight:700; letter-spacing:-.02em; }
  .tag em { font-style:normal; color:var(--signal); }
  .lede { margin:12px 0 0; font-size:18px; line-height:1.45; color:#b8b8bf; width:520px; text-shadow:0 1px 12px #000; }
  .stats { margin-top:24px; display:flex; gap:32px; }
  .stat b { display:block; font-size:34px; font-weight:800; letter-spacing:-.03em; color:#fff; }
  .stat span { font-family:var(--mono); font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:#8e8e93; }
  .pill { position:absolute; left:60px; bottom:40px; display:flex; gap:10px; z-index:3; }
  .pill span { font-family:var(--mono); font-size:13.5px; font-weight:700; padding:7px 13px; border-radius:18px; border:1.5px solid rgba(255,255,255,.2); color:#e5e5ea; background:rgba(0,0,0,.6); }
  .pill span.b { background:var(--blue); border-color:var(--blue); color:#fff; box-shadow:0 0 24px rgba(0,113,227,.55); }
  .art { position:absolute; left:520px; top:0; width:680px; height:630px; z-index:2; }
  .art svg { display:block; }
  #labels { position:absolute; inset:0; z-index:4; pointer-events:none; }
  .lbl { position:absolute; font-family:var(--mono); font-size:12.5px; color:#a1a1a6; text-align:center; transform:translate(-50%,-50%); white-space:nowrap; }
  .lbl b { display:block; font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:#e5e5ea; }
  .lbl span { display:block; margin-top:3px; }
  .lbl.box { padding:7px 12px; border-radius:12px; background:rgba(8,10,14,.85); border:1px solid rgba(255,255,255,.14); }
  .lbl.chip { padding:6px 11px; border-radius:13px; font-size:12.5px; font-weight:700; color:#cfe6ff; background:rgba(10,20,35,.85); border:1px solid rgba(41,151,255,.5); box-shadow:0 0 16px rgba(41,151,255,.2); }
  .lbl.left { transform:translate(0,-50%); text-align:left; }
  .lbl.right { transform:translate(-100%,-50%); text-align:right; }
  .ok { color:var(--green) !important; } .warn { color:var(--amber) !important; } .bad { color:var(--red) !important; } .sig { color:var(--signal) !important; } .cy { color:var(--cyan) !important; } .vi { color:var(--violet) !important; }
</style>
</head>
<body>
<div class="aurora"></div>
<div class="art"><svg id="art" width="680" height="630" viewBox="0 0 680 630" xmlns="http://www.w3.org/2000/svg"></svg></div>
<div id="labels"></div>
<div class="copy">
  <div class="brand"><svg viewBox="0 0 64 64" width="30" height="30" aria-hidden="true"><defs><linearGradient id="zb" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ff5a15"/><stop offset="1" stop-color="#cc420a"/></linearGradient></defs><rect width="64" height="64" rx="15" fill="url(#zb)"/><path d="M18.5,20.5 45.5,20.5 18.5,43.5 45.5,43.5" fill="none" stroke="#fff" stroke-width="8.3" stroke-linecap="round" stroke-linejoin="round"/></svg><b>Zyvor</b><span>&middot;</span><span>Edge fleet control plane</span></div>
  <div class="word">Fleet</div>
  <div class="tag">Every site.<br><em>Still running.</em></div>
  <div class="lede">Offline-first edge control plane: a small agent caches desired state and keeps reconciling when the WAN drops. No remote shell.</div>
  <div class="stats"><div class="stat"><b>4</b><span>runtime adapters</span></div><div class="stat"><b>0</b><span>Go dependencies</span></div><div class="stat"><b>3</b><span>binaries</span></div></div>
</div>
<div class="pill"><span class="b">github.com/zyvorai/zyvorai-fleet</span><span>Apache-2.0</span></div>
<script>
var Z = (function () {
  var NS = 'http://www.w3.org/2000/svg', svg = document.getElementById('art'), labels = document.getElementById('labels');
  var seed = 20261004;
  function rnd() { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; }
  function el(tag, a, parent) { var n = document.createElementNS(NS, tag); for (var k in a) n.setAttribute(k, a[k]); (parent || svg).appendChild(n); return n; }
  function g(attrs) { return el('g', attrs || {}); }
  function label(x, y, inner, cls, style) { var d = document.createElement('div'); d.className = 'lbl ' + (cls || ''); d.style.left = (520 + x) + 'px'; d.style.top = y + 'px'; if (style) d.setAttribute('style', d.getAttribute('style') + ';' + style); d.innerHTML = inner; labels.appendChild(d); return d; }
  return { NS: NS, svg: svg, W: 680, H: 630, rnd: rnd, el: el, g: g, label: label,
    reseed: function (s) { seed = s; },
    c: { blue: '#0071e3', signal: '#2997ff', cyan: '#64d2ff', green: '#30d158', amber: '#ff9f0a', red: '#ff453a', violet: '#bf5af2', teal: '#40c8e0', indigo: '#5e5ce6', pink: '#ff375f', white: '#f5f5f7', grey: '#8e8e93' } };
})();
(function () {
// Fleet: night map of edge sites. Some WAN links are cut, but every site keeps glowing with its own cached desired state and reconcile loop.
var C = Z.c;
var defs = Z.el('defs', {});
defs.innerHTML = '<filter id="flGl" filterUnits="userSpaceOnUse" x="-50" y="-50" width="780" height="730"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>' +
  '<filter id="flSf" filterUnits="userSpaceOnUse" x="-50" y="-50" width="780" height="730"><feGaussianBlur stdDeviation="12"/></filter>' +
  '<radialGradient id="flSite"><stop offset="0" stop-color="#30d158" stop-opacity=".55"/><stop offset="1" stop-color="#30d158" stop-opacity="0"/></radialGradient>' +
  '<radialGradient id="flHub"><stop offset="0" stop-color="#2997ff" stop-opacity=".6"/><stop offset="1" stop-color="#2997ff" stop-opacity="0"/></radialGradient>' +
  '<marker id="flArr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#30d158"/></marker>';

// landmass as a halftone dot map: union of soft blobs
var blobs = [];
for (var b = 0; b < 16; b++) blobs.push([130 + Z.rnd() * 500, 150 + Z.rnd() * 420, 50 + Z.rnd() * 80]);
blobs.push([360, 330, 150], [520, 420, 110], [230, 470, 90]);
function land(x, y) {
  var v = 0;
  for (var k = 0; k < blobs.length; k++) { var dx = x - blobs[k][0], dy = (y - blobs[k][1]) * 1.2; v += Math.exp(-(dx * dx + dy * dy) / (blobs[k][2] * blobs[k][2])); }
  return v;
}
var tex = Z.g({});
for (var y = 40; y < 600; y += 9) for (var x = 70; x < 660; x += 9) {
  var v = land(x, y);
  if (v < .95) continue;
  var edge = Math.min(1, (v - .95) * 1.6), fade = x < 110 ? (x - 70) / 40 : 1;
  Z.el('circle', { cx: x + ((y / 9) % 2) * 4.5, cy: y, r: (0.9 + edge * .8).toFixed(2), fill: '#6a9be0', opacity: (fade * (.14 + edge * .22)).toFixed(3) }, tex);
}
// faint latitude arcs
for (var i = 0; i < 5; i++) Z.el('path', { d: 'M70,' + (120 + i * 110) + ' Q365,' + (80 + i * 110) + ' 660,' + (120 + i * 110), fill: 'none', stroke: 'rgba(120,170,255,.06)' });

var hub = [430, 70];
var sites = [
  { x: 160, y: 240, up: true }, { x: 300, y: 400, up: false, name: 'factory-pune-01' }, { x: 505, y: 255, up: true },
  { x: 575, y: 440, up: false }, { x: 625, y: 195, up: true }, { x: 235, y: 530, up: false }, { x: 255, y: 150, up: true },
  { x: 425, y: 515, up: true }
];
// WAN links
sites.forEach(function (s, i) {
  var d = 'M' + hub[0] + ',' + hub[1] + ' Q' + s.x + ',' + (hub[1] + 24) + ' ' + s.x + ',' + s.y;
  var p = Z.el('path', { d: d, fill: 'none', stroke: s.up ? C.signal : 'none', 'stroke-width': 1.6, opacity: .75 });
  if (s.up) { p.setAttribute('filter', 'url(#flGl)'); return; }
  // cut WAN link: dashed red up to the break, faint grey after it
  var L = p.getTotalLength(), q = p.getPointAtLength(L * .55);
  function seg(t0, t1) { var dd = ''; for (var t = t0; t <= t1 + 1e-6; t += .01) { var pt = p.getPointAtLength(L * t); dd += (dd ? ' L' : 'M') + pt.x.toFixed(1) + ',' + pt.y.toFixed(1); } return dd; }
  Z.el('path', { d: seg(0, .5), fill: 'none', stroke: C.red, 'stroke-width': 1.4, opacity: .7, 'stroke-dasharray': '5 5' });
  Z.el('path', { d: seg(.6, 1), fill: 'none', stroke: 'rgba(200,210,230,.35)', 'stroke-width': 1.2, 'stroke-dasharray': '2 6' });
  Z.el('path', { d: 'M' + (q.x - 5) + ',' + (q.y - 5) + ' l10,10 M' + (q.x + 5) + ',' + (q.y - 5) + ' l-10,10', stroke: C.red, 'stroke-width': 2, 'stroke-linecap': 'round', filter: 'url(#flGl)' });
  s.cut = q;
});

// hub: fleetd control plane
Z.el('circle', { cx: hub[0], cy: hub[1], r: 50, fill: 'url(#flHub)' });
Z.el('circle', { cx: hub[0], cy: hub[1], r: 15, fill: '#06101c', stroke: C.signal, 'stroke-width': 2, filter: 'url(#flGl)' });
Z.el('circle', { cx: hub[0], cy: hub[1], r: 5, fill: '#fff', filter: 'url(#flGl)' });

// sites: green core, cache ring, reconcile loop arrow
sites.forEach(function (s, i) {
  var big = !!s.name, R = big ? 26 : 18;
  Z.el('circle', { cx: s.x, cy: s.y, r: R * 2.2, fill: 'url(#flSite)', opacity: s.up ? .55 : .9 });
  Z.el('circle', { cx: s.x, cy: s.y, r: R, fill: 'none', stroke: C.green, 'stroke-width': 1, opacity: .35, 'stroke-dasharray': '2 3' });
  // reconcile loop (3/4 arc with arrowhead) - brighter where WAN is down
  var a0 = -Math.PI * .1, a1 = Math.PI * 1.35, r = R - 5;
  var x0 = s.x + r * Math.cos(a0), y0 = s.y + r * Math.sin(a0), x1 = s.x + r * Math.cos(a1), y1 = s.y + r * Math.sin(a1);
  Z.el('path', { d: 'M' + x0.toFixed(1) + ',' + y0.toFixed(1) + ' A' + r + ',' + r + ' 0 1 1 ' + x1.toFixed(1) + ',' + y1.toFixed(1), fill: 'none', stroke: C.green, 'stroke-width': s.up ? 1.4 : 2, opacity: s.up ? .55 : .95, 'marker-end': 'url(#flArr)', filter: s.up ? null : 'url(#flGl)' });
  // cached revision: small stacked disk at the core
  Z.el('circle', { cx: s.x, cy: s.y, r: big ? 6 : 4.5, fill: C.green, filter: 'url(#flGl)' });
  Z.el('circle', { cx: s.x, cy: s.y, r: big ? 2.4 : 1.8, fill: '#eafff0' });
});

// city lights scattered near sites
for (var i = 0; i < 90; i++) {
  var s = sites[Math.floor(Z.rnd() * sites.length)], a = Z.rnd() * Math.PI * 2, rr = 26 + Z.rnd() * 40;
  Z.el('circle', { cx: (s.x + rr * Math.cos(a)).toFixed(1), cy: (s.y + rr * Math.sin(a) * .8).toFixed(1), r: (0.6 + Z.rnd() * 1.1).toFixed(2), fill: Z.rnd() > .4 ? '#ffe7b0' : C.cyan, opacity: (.15 + Z.rnd() * .4).toFixed(2) });
}

Z.label(hub[0] + 28, hub[1], '<b>fleetd</b><span>desired state</span>', 'left');
Z.label(300, 446, 'factory-pune-01', '', 'color:#e5e5ea;font-size:12px');
var cs = sites[3].cut;
Z.label(cs.x + 14, cs.y, 'WAN down', 'left bad', 'font-size:11.5px');
Z.label(560, 592, '<span class="ok" style="display:inline">&#9679;</span> reconciling offline', 'chip');
})();
</script>
</body>
</html>
